<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Explainer</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="panel-header">
      <h1>Screen Explainer</h1>
      <div class="header-actions">
        <button id="new-chat" class="text-button" type="button">New chat</button>
        <!-- Cycles System -> Light -> Dark; label is set by sidepanel.js -->
        <button id="theme-switch" class="text-button" type="button">Theme: System</button>
      </div>
    </header>

    <div class="conversation-wrap">
      <main id="conversation" class="conversation">
        <div class="conversation-inner">
          <div id="empty-state" class="empty-state" hidden>
            <p id="empty-shortcut"></p>
            <p>Capture the screen or some selected text.</p>
            <p>Then ask a question about it.</p>
          </div>

          <div id="messages" aria-live="polite"></div>

          <div id="chat-error" class="error-block" hidden>
            <p class="error-title">Couldn't get an answer</p>
            <p id="chat-error-text"></p>
            <button id="retry" type="button">Try again</button>
            <details id="chat-error-details" hidden>
              <summary>Details</summary>
              <pre id="chat-error-list"></pre>
            </details>
          </div>
        </div>
      </main>
      <button id="jump-latest" class="jump-latest" type="button" hidden>Jump to latest</button>
    </div>

    <p id="chat-status" class="meta status-line" aria-live="polite"></p>

    <footer class="composer">
      <div class="capture-row">
        <span class="meta capture-label">Capture</span>
        <!-- Filled from CAPTURE_MODES in shared/constants.js -->
        <div id="mode-buttons" class="mode-buttons" role="group" aria-label="Capture options"></div>
      </div>
      <p id="capture-status" class="meta capture-status"></p>

      <div id="preview-large" class="preview-large" hidden>
        <img id="preview-large-image" alt="Captured screenshot" />
      </div>

      <div id="preview" class="attachment" hidden>
        <button
          id="preview-toggle"
          class="thumb-button"
          type="button"
          aria-expanded="false"
          aria-controls="preview-large"
          aria-label="Show larger screenshot"
          hidden
        >
          <img id="preview-image" alt="" hidden />
        </button>
        <div class="attachment-body">
          <span id="preview-meta" class="meta"></span>
          <span id="preview-text" class="attachment-first-line" hidden></span>
        </div>
        <button id="look-again" class="text-button" type="button" hidden>Look again</button>
        <button id="remove-capture" class="text-button" type="button">Remove</button>
      </div>
      <p id="context-line" class="meta context-line"></p>

      <form id="ask-form" class="ask-row">
        <textarea
          id="question"
          rows="1"
          aria-label="Question"
          placeholder="Ask about what you captured"
        ></textarea>
        <button id="ask-button" class="primary" type="submit">Ask</button>
      </form>
    </footer>

    <script src="shared/constants.js"></script>
    <script src="markdown.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
