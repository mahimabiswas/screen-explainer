<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Screen Explainer</title>
    <style>
      #screenshot {
        max-width: 100%;
      }
      #answer {
        white-space: pre-wrap;
      }
      #answer.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>hello</h1>
    <img id="screenshot" alt="Latest screenshot" hidden />
    <form id="ask-form">
      <input id="question" type="text" placeholder="Ask about the screenshot" required />
      <button id="ask-button" type="submit">Ask</button>
    </form>
    <div id="answer"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
